services:
  postgres:
    ports: []   # NÃO expõe o banco externamente em produção
    deploy:
      resources:
        limits:
          memory: 512M

  chronus:
    env_file:
      - .env.prod
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  evolution-api:
    ports: []   # NÃO expõe externamente em produção
    restart: always