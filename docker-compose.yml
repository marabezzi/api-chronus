# Compose V2 — campo "version" removido (deprecado)
# https://docs.docker.com/compose/compose-file/

services:

  postgres:
    image: postgres:16-alpine
    container_name: chronus-db
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-chronus}
      POSTGRES_USER:     ${POSTGRES_USER:-chronus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chronus}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chronus}"]
      interval: 10s
      timeout: 5s
      retries: 5

  evolution-api:
    image: atendai/evolution-api:latest
    container_name: evolution-api
    ports:
      - "8082:8080"
    environment:
      - SERVER_URL=http://localhost:8082
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-chronus_evolution_key}
      - DATABASE_ENABLED=false
      - REDIS_ENABLED=false
      - DEL_INSTANCE=false
    volumes:
      - evolution_data:/evolution/instances
    restart: unless-stopped

  chronus:
    build: .
    container_name: chronus-api
    ports:
      - "8081:8081"
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./logos:/app/logos
      - ./tratamentos:/app/tratamentos
    restart: unless-stopped

volumes:
  postgres_data:
  evolution_data: