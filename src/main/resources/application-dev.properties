# Perfil: DEV
# As variáveis abaixo são lidas do arquivo .env via Docker ou IDE.
# Se qualquer variável estiver ausente, o Spring falhará na inicialização
# (comportamento intencional — força o dev a configurar o .env).
# Endereço IP do relógio iDClass na rede local
idclass.host=${IDCLASS_HOST}
# Porta HTTPS do relógio (padrão iDClass: 443)
idclass.port=${IDCLASS_PORT}
# Usuário da API do relógio
idclass.user=${IDCLASS_USER}
# Senha da API do relógio
idclass.password=${IDCLASS_PASSWORD}
# Porta em que o Chronus vai escutar localmente
server.port=8081
# Logs detalhados no pacote da aplicação (DEBUG mostra tudo)
# ── Perfil ─────────────────────────────────────────────────────────────────
spring.application.name=chronus-dev

# ── Log detalhado ──────────────────────────────────────────────────────────
logging.level.root=INFO
logging.level.br.com.atom=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.web=DEBUG

# ── Banco ──────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# Cria e atualiza tabelas automaticamente em DEV
spring.jpa.hibernate.ddl-auto=update

# ── Empresa ────────────────────────────────────────────────────────────────
empresa.cnpj=${EMPRESA_CNPJ}
empresa.razaoSocial=${EMPRESA_RAZAO_SOCIAL}
empresa.cei=${EMPRESA_CEI:000000000000}
empresa.local=${EMPRESA_LOCAL}
empresa.numFabricacao=${EMPRESA_NUM_FABRICACAO:00000000000000000}

# ── Logos ──────────────────────────────────────────────────────────────────
logo.empresa.path=${LOGO_EMPRESA_PATH:/app/logos/empresa.png}
logo.chronus.path=${LOGO_CHRONUS_PATH:/app/logos/chronus.png}

# ── Tratamentos ────────────────────────────────────────────────────────────
tratamentos.path=${TRATAMENTOS_PATH:/app/tratamentos}

# ── App ────────────────────────────────────────────────────────────────────
app.timezone=${APP_TIMEZONE:America/Sao_Paulo}

# ── E-mail ─────────────────────────────────────────────────────────────────
mail.from=${MAIL_FROM:Chronus DEV <dev@empresa.com.br>}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false