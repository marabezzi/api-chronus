# Perfil: DEV
# As variáveis abaixo são lidas do arquivo .env via Docker ou IDE.
# Se qualquer variável estiver ausente, o Spring falhará na inicialização
# (comportamento intencional — força o dev a configurar o .env).
# Endereço IP do relógio iDClass na rede local
idclass.host=${IDCLASS_HOST}
# Porta HTTPS do relógio (padrão iDClass: 443)
idclass.port=${IDCLASS_PORT}
# Usuário da API do relógio
idclass.user=${IDCLASS_USER}
# Senha da API do relógio
idclass.password=${IDCLASS_PASSWORD}
# Porta em que o Chronus vai escutar localmente
server.port=8081
# Logs detalhados no pacote da aplicação (DEBUG mostra tudo)
logging.level.com.chronus=DEBUG


empresa.cnpj=${EMPRESA_CNPJ}
empresa.razaoSocial=${EMPRESA_RAZAO_SOCIAL}
empresa.cei=${EMPRESA_CEI:000000000000}
empresa.local=${EMPRESA_LOCAL}
empresa.numFabricacao=${EMPRESA_NUM_FABRICACAO:00000000000000000}

# ── PostgreSQL ─────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://postgres:5432/${POSTGRES_DB:chronus}
spring.datasource.username=${POSTGRES_USER:chronus}
spring.datasource.password=${POSTGRES_PASSWORD:chronus}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Logos
logo.empresa.path=${LOGO_EMPRESA_PATH:/app/logos/empresa.png}
logo.chronus.path=${LOGO_CHRONUS_PATH:/app/logos/chronus.png}

# Pasta de documentos dos tratamentos
tratamentos.path=/app/tratamentos

# Timezone
app.timezone=${APP_TIMEZONE:America/Sao_Paulo}


# ── SMTP ───────────────────────────────────────────────────────────────
spring.mail.host=${MAIL_HOST:mail.suaempresa.com.br}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:chronus@suaempresa.com.br}
spring.mail.password=${MAIL_PASSWORD:senha}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Remetente
mail.from=${MAIL_FROM:Chronus Ponto <chronus@suaempresa.com.br>}