# Perfil: PROD
# Em produção as variáveis DEVEM vir de variáveis de ambiente do servidor
# ou de um cofre de segredos (ex: AWS Secrets Manager, Vault).
# Sem valor padrão intencional: se faltar, a aplicação não sobe.
idclass.host=${IDCLASS_HOST}
idclass.port=${IDCLASS_PORT}
idclass.user=${IDCLASS_USER}
idclass.password=${IDCLASS_PASSWORD}
server.port=8081
# Em produção loga apenas WARNING para não poluir e não vazar dados nos logs
logging.level.com.chronus=WARN



empresa.cnpj=${EMPRESA_CNPJ}
empresa.razaoSocial=${EMPRESA_RAZAO_SOCIAL}
empresa.cei=${EMPRESA_CEI}
empresa.local=${EMPRESA_LOCAL}
empresa.numFabricacao=${EMPRESA_NUM_FABRICACAO}

# ── PostgreSQL ─────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://postgres:5432/${POSTGRES_DB:chronus}
spring.datasource.username=${POSTGRES_USER:chronus}
spring.datasource.password=${POSTGRES_PASSWORD:chronus}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect