# Perfil: PROD
# Em produção as variáveis DEVEM vir de variáveis de ambiente do servidor
# ou de um cofre de segredos (ex: AWS Secrets Manager, Vault).
# Sem valor padrão intencional: se faltar, a aplicação não sobe.
# ── Perfil ─────────────────────────────────────────────────────────────────
spring.application.name=chronus

# ── Log mínimo ─────────────────────────────────────────────────────────────
logging.level.root=WARN
logging.level.br.com.atom=INFO
logging.level.org.hibernate.SQL=WARN

# ── Banco ──────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# PROD: nunca altera o schema automaticamente
spring.jpa.hibernate.ddl-auto=validate

# Pool de conexões para produção
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# ── Relógio ────────────────────────────────────────────────────────────────
idclass.host=${IDCLASS_HOST}
idclass.port=${IDCLASS_PORT:443}
idclass.user=${IDCLASS_USER}
idclass.password=${IDCLASS_PASSWORD}

# ── Empresa ────────────────────────────────────────────────────────────────
empresa.cnpj=${EMPRESA_CNPJ}
empresa.razaoSocial=${EMPRESA_RAZAO_SOCIAL}
empresa.cei=${EMPRESA_CEI:000000000000}
empresa.local=${EMPRESA_LOCAL}
empresa.numFabricacao=${EMPRESA_NUM_FABRICACAO:00000000000000000}

# ── Logos ──────────────────────────────────────────────────────────────────
logo.empresa.path=${LOGO_EMPRESA_PATH:/app/logos/empresa.png}
logo.chronus.path=${LOGO_CHRONUS_PATH:/app/logos/chronus.png}

# ── Tratamentos ────────────────────────────────────────────────────────────
tratamentos.path=${TRATAMENTOS_PATH:/app/tratamentos}

# ── App ────────────────────────────────────────────────────────────────────
app.timezone=${APP_TIMEZONE:America/Sao_Paulo}

# ── E-mail ─────────────────────────────────────────────────────────────────
mail.from=${MAIL_FROM}
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000