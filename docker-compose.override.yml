# Ativo automaticamente em DEV (docker-compose up usa este por padrão)
services:
  chronus:
    environment:
      - SPRING_PROFILES_ACTIVE=dev
    # Monta código fonte para hot-reload (opcional)

  postgres:
    ports:
      - "127.0.0.1:${CHRONUS_DB_PORT:-5441}:5432"   # Expõe banco em DEV para acesso externo (DBeaver, etc.)

  evolution-api:
    ports:
      - "127.0.0.1:${EVOLUTION_API_PORT:-8112}:8080"