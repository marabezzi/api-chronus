# Ativo automaticamente em DEV (docker-compose up usa este por padrão)
services:
  chronus:
    environment:
      - SPRING_PROFILES_ACTIVE=dev
    # Monta código fonte para hot-reload (opcional)

  postgres:
    ports:
      - "5432:5432"   # Expõe banco em DEV para acesso externo (DBeaver, etc.)

  evolution-api:
    ports:
      - "8082:8080"